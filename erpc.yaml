  - id: plinko
    # ISOLATED lane for the Plinko game-server resolver. `main` requires 2/3 upstream consensus on eth_call, but
    # Monad testnet public nodes are pruned/load-balanced and DISAGREE on rounds() → "not enough agreement" → the
    # resolver cannot read round state → nothing settles. Here: NO consensus, just failover + retry over one
    # upstream per call → a consistent answer. Additive; touches no other lane.
    upstreamDefaults:
      evm:
        statePollerInterval: 15s
    networkDefaults:
      evm:
        getLogsMaxAllowedRange: 10000
        getLogsSplitOnError: true
      failsafe:
        - matchMethod: "*"
          retry:
            maxAttempts: 4
            delay: 100ms
            backoffFactor: 1.5
            backoffMaxDelay: 3s
          timeout:
            duration: 25s
    networks:
      - architecture: evm
        alias: monad-testnet
        evm: { chainId: 10143, fallbackFinalityDepth: 32 }
    upstreams:
      - id: pl-monad-official
        endpoint: https://testnet-rpc.monad.xyz
        evm: { chainId: 10143 }
# =============================================================================
# erpc.yaml — STAGING gateway on the shared EC2 (rpc.7kt.org/<slug>)
# Runs in /home/ubuntu/erpc/ via docker-compose.yml, behind the existing predix-nginx.
# Slugs map to eRPC network aliases: rpc.7kt.org/base-sepolia -> /main/base-sepolia.
#
# 2026-07-21: extended to 29 networks (24 mainnet + 5 testnet) and AUTH ENABLED on
# project `main` (network allowlist + secret). project `plinko` stays open. Set
# ERPC_AUTH_SECRET in .env before restart (empty => all credentials rejected, fail-closed).
# =============================================================================

logLevel: info

database:
  evmJsonRpcCache:
    connectors:
      - id: memory-cache
        driver: memory
        memory:
          maxItems: 100000
          maxTotalSize: "256MB"
      - id: redis-cache
        driver: redis
        redis:
          addr: redis://erpc-redis-gw:6379   # my own redis container (erpc_internal network)
    policies:
      - connector: memory-cache
        network: "*"
        method: "eth_simulateV1"
        finality: unfinalized
        ttl: 30s
      - connector: redis-cache
        network: "*"
        method: "eth_simulateV1"
        finality: finalized
        ttl: 0
      - connector: redis-cache
        network: "*"
        method: "eth_getLogs"
        finality: finalized
        ttl: 0
      - connector: redis-cache
        network: "*"
        method: "eth_getCode|eth_getStorageAt"
        finality: finalized
        ttl: 0
      # ---- indexer read methods (immutable once finalized) ----
      - connector: redis-cache
        network: "*"
        method: "eth_getBlockByNumber|eth_getBlockByHash|eth_getBlockReceipts|eth_getTransactionReceipt|eth_getTransactionByHash"
        finality: finalized
        ttl: 0
      # ---- realtime head-block cache (2s) — collapse repeated head polling (indexers/dApps) ----
      - connector: memory-cache
        network: "*"
        method: "eth_getBlockByNumber"
        finality: realtime
        ttl: 2s

server:
  httpHostV4: 0.0.0.0
  httpPortV4: 4000
  maxTimeout: 60s
  waitBeforeShutdown: 30s
  waitAfterShutdown: 10s
  includeErrorDetails: false        # don't echo upstream error internals (URLs/keys) to clients
  trustedIPHeaders: ["X-Real-IP", "CF-Connecting-IP"]   # X-Real-IP = nginx $remote_addr (real client; cf-real-ip snippet sets it behind CF) — primary source for the auth IP allowlist
  trustedIPForwarders:              # peers trusted to set the headers above (localhost + predix docker net + Cloudflare edge)
    - "127.0.0.1/8"
    - "::1/128"
    - "172.18.0.0/16"               # predix docker network: predix-nginx (172.18.0.10) proxies to erpc-gateway from here
    - "173.245.48.0/20"
    - "103.21.244.0/22"
    - "103.22.200.0/22"
    - "103.31.4.0/22"
    - "141.101.64.0/18"
    - "108.162.192.0/18"
    - "190.93.240.0/20"
    - "188.114.96.0/20"
    - "197.234.240.0/22"
    - "198.41.128.0/17"
    - "162.158.0.0/15"
    - "104.16.0.0/13"
    - "104.24.0.0/14"
    - "172.64.0.0/13"
    - "131.0.72.0/22"

metrics:
  enabled: true
  hostV4: 0.0.0.0
  port: 4001
  histogramDropLabels: ["user", "agent_name"]   # reduce Prometheus cardinality

rateLimiters:
  budgets:
    - id: public-node
      rules:
        - method: "eth_getLogs"
          maxCount: 8
          period: second
        - method: "*"
          maxCount: 25
          period: second
    - id: envio-budget
      rules:
        - method: "*"
          maxCount: 40
          period: second
    - id: keyed-node
      rules:
        - method: "*"
          maxCount: 50
          period: second

projects:
  - id: main

    cors:                           # browser dApps: ONLY our domains (+their subdomains) may call
      allowedOrigins:
        - "https://feliciastation.com"
        - "https://*.feliciastation.com"
        - "https://7kt.org"
        - "https://*.7kt.org"
        - "https://predixpro.io"
        - "https://*.predixpro.io"
      allowedMethods: ["GET", "POST", "OPTIONS"]
      allowedHeaders: ["content-type", "authorization", "x-erpc-secret-token"]
      maxAge: 7200                  # cache preflight 2h (Chrome's cap) — fewer OPTIONS round-trips

    # ---- AUTH (project `main` only; other projects e.g. `plinko` keep their open lane) ----
    # OR-composed: a request passes if EITHER strategy authorizes.
    #   network: a no-credential request is allowed ONLY from localhost or an allowlisted IP.
    #     Each entry is a single host address (/32). NEVER widen to a /16 or /24 — this box is
    #     multi-tenant (predix / plinko / indexer containers share these bridges) and a subnet
    #     allowlist would let every container call this project unauthenticated.
    #       54.179.230.27 = this EC2's public IP — the Price Pinball / same-host scanner reaching
    #         the gateway through Cloudflare + nginx. Needs NO change on its side.
    #       172.22.0.1    = the erpc_internal docker bridge GATEWAY, i.e. processes on the HOST
    #         hitting the published 127.0.0.1:4000 port. Docker's userland proxy SNATs those
    #         connections, so eRPC sees the bridge gateway and NOT 127.0.0.1 — which is exactly
    #         why `allowLocalhost` alone does NOT cover host-local callers. Verified:
    #         `docker-proxy -host-ip 127.0.0.1 -host-port 4000 -container-ip 172.22.0.5`, and the
    #         live conn is 172.22.0.1 -> 172.22.0.5:4000. This lets the on-host aggregator/probes
    #         call without embedding the secret in a URL (secrets in URLs leak into job records).
    #         Safe because: the port binds 127.0.0.1 ONLY (containers cannot reach it at all), and
    #         a container cannot source-spoof the gateway address over a real TCP handshake.
    #       172.18.0.1    = the predix bridge gateway. Not used today (the port publishes on the
    #         erpc_internal IP), listed pre-emptively: erpc-gateway sits on BOTH bridges, so a
    #         future recreate could republish the port on the predix IP and silently flip the
    #         source to 172.18.0.1 — which would 401 the on-host aggregator with no obvious cause.
    #         Same security class as 172.22.0.1 (a host-side gateway address, unreachable and
    #         unspoofable from containers), so listing both costs nothing and removes that trap.
    #         Check which one is live: pgrep -af docker-proxy | grep 4000   (-container-ip 172.22.x
    #         => source 172.22.0.1;  -container-ip 172.18.x => source 172.18.0.1)
    #     eRPC resolves the real client IP from nginx's X-Real-IP (server.trustedIPForwarders
    #     trusts the predix net); spoofing is blocked (rightmost-untrusted). NOTE: an EC2 IP can
    #     change — move that consumer to the secret for a durable setup.
    #   secret: everyone else presents ${ERPC_AUTH_SECRET} — Basic-auth password
    #     (https://x:SECRET@rpc.7kt.org/<slug>), header X-ERPC-Secret-Token, or ?secret=.
    # No secret + non-allowlisted IP => REJECTED. Empty ERPC_AUTH_SECRET => every credential
    # rejected (fail-closed, never silently open).
    auth:
      strategies:
        - type: network
          network:
            allowLocalhost: true
            allowedIPs:
              - "54.179.230.27"     # this EC2's public IP (Pinball / scanner, via Cloudflare+nginx)
              - "172.22.0.1"        # erpc_internal bridge gateway = on-host callers via 127.0.0.1:4000 (docker SNAT) — the live one
              - "172.18.0.1"        # predix bridge gateway — same host, pre-listed so a recreate that flips the published bridge can't silently 401 on-host callers
        - type: secret
          secret:
            id: main
            value: ${ERPC_AUTH_SECRET}

    scoreMetricsWindowSize: 30s
    upstreamDefaults:
      evm:
        statePollerInterval: 15s
        getLogsAutoSplittingRangeThreshold: 2000  # split getLogs ranges >2000 blocks proactively

    networkDefaults:
      directiveDefaults:
        validateLogsBloomEmptiness: true   # logs exist => bloom!=0 (catch a node dropping logs)
        validateLogFields: true            # structural log validation
        validateTransactionFields: true          # structural tx validation
        validateLogsBloomMatch: true             # recompute bloom from logs — strongest "node dropped logs" check
        enforceLogIndexStrictIncrements: true    # logIndex must strictly increase (catch reordered/missing logs)
        validateTransactionsRoot: true           # BSC phantom-tx detection
        enforceHighestBlock: true                # never serve a stale head from a lagging free node
      evm:
        getLogsMaxAllowedRange: 10000   # hard ceiling per getLogs request
        getLogsSplitOnError: true       # bisect on 'range too large' from a public node
        getLogsSplitConcurrency: 4      # gentle parallelism on free endpoints
        emptyResultConfidence: finalizedBlock  # unfinalized empty (null receipt/tx) => not-yet-confirmed
      failsafe:
        - matchMethod: "eth_simulateV1|eth_call|eth_getCode|eth_getStorageAt"
          matchFinality: [unfinalized, finalized]
          consensus:
            maxParticipants: 3
            agreementThreshold: 2
            disputeBehavior: returnError
            lowParticipantsBehavior: acceptMostCommonValidResult
            punishMisbehavior:
              disputeThreshold: 5
              disputeWindow: 5m
              sitOutPenalty: 10m
          retry:
            maxAttempts: 3
        # getLogs: dedicated rule (matched before "*"). No hedge — hedging heavy
        # archive scans doubled free-tier load and let fast wrong-empty nodes win
        # races. Higher empty-retry budget: a wrong [] (pruned node) is converted to
        # missing-data (emptyResultConfidence=finalizedBlock) and retried on the
        # next archive-log upstream instead of being accepted after 2 tries.
        - matchMethod: "eth_getLogs"
          retry:
            maxAttempts: 4
            delay: 0ms
            backoffFactor: 1.5
            backoffMaxDelay: 3s
            emptyResultMaxAttempts: 4
            emptyResultDelay: 200ms
          timeout:
            duration: 30s
        - matchMethod: "*"
          retry:
            maxAttempts: 5
            delay: 0ms
            backoffFactor: 1.5
            backoffMaxDelay: 3s
            emptyResultMaxAttempts: 2
            emptyResultDelay: 1s
          hedge:
            delay: 150ms
            maxCount: 1
          timeout:
            duration: 20s

